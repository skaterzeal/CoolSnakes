name: Build & Deploy iOS (TestFlight / App Store)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to TestFlight / App Store Connect'
        required: true
        type: boolean
        default: true

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-and-deploy:
    name: Build & Deploy iOS
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify analysis & tests
        run: |
          flutter analyze
          flutter test

      - name: Check for App Store Connect API Key
        id: check-api-key
        run: |
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" ] && [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]; then
            echo "has_api_key=true" >> $GITHUB_OUTPUT
            echo "✅ App Store Connect API Key detected."
          else
            echo "has_api_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ App Store Connect API Key not detected."
          fi

      - name: Build & Upload to TestFlight via Fastlane
        if: steps.check-api-key.outputs.has_api_key == 'true'
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          bundle exec fastlane beta

      - name: Build Unsigned iOS Archive (Fallback when API key missing)
        if: steps.check-api-key.outputs.has_api_key != 'true'
        run: |
          flutter build ios --release --no-codesign
          echo "=================================================================="
          echo "⚠️ App Store Connect API key secrets are not configured."
          echo "To enable automated TestFlight deployment, add:"
          echo "  - APP_STORE_CONNECT_API_KEY_ID"
          echo "  - APP_STORE_CONNECT_API_ISSUER_ID"
          echo "  - APP_STORE_CONNECT_API_KEY_BASE64"
          echo "in GitHub Repository Settings > Secrets and variables > Actions."
          echo "=================================================================="

      - name: Upload IPA Artifact
        if: steps.check-api-key.outputs.has_api_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CoolSnakes-iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14
